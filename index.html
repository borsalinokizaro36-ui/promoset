<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="adapter.js"></script>
</head>
<body>
<title>Промосеть</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: рабочий пульт — шапка с датой и проектом, вкладки модулей, сводка сверху, детали ниже */
:root{--bg:#F4F6F5;--surface:#FFFFFF;--surface-2:#E9F3F1;--line:#D5E1DE;--ink:#0E2A47;--ink-2:#4A5F73;--ink-3:#7A8C9B;--brand:#0E2A47;--brand-ink:#FFF8F0;--teal:#0F8C80;--teal-soft:#D3F0EC;--accent:#E8622C;--accent-soft:#FFE6DA;--good:#18855B;--good-soft:#DDF3E8;--warn:#B7791F;--warn-soft:#FBEFD5;--bad:#C2352B;--bad-soft:#FBE1DE;--info:#2F6FB0;--info-soft:#DDEAF8;--muted-soft:#ECEFF1;--map-land:#DCEEEA;--map-line:#FFFFFF;--map-city:#BFD8D2;--shadow:0 1px 2px rgba(14,42,71,.06),0 4px 16px rgba(14,42,71,.06);--f-display:'Rubik',ui-rounded,'Segoe UI',Arial,sans-serif;--f-body:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1724;--surface:#122233;--surface-2:#15303A;--line:#24394C;--ink:#EAF1F5;--ink-2:#AFC0CD;--ink-3:#7F93A3;--brand:#0A1F33;--brand-ink:#FFF3E8;--teal:#3FC7B8;--teal-soft:#123F42;--accent:#FF8752;--accent-soft:#4A2618;--good:#4CC992;--good-soft:#123B2C;--warn:#E8B04E;--warn-soft:#3F3015;--bad:#FF7A6E;--bad-soft:#4A1F1C;--info:#7DB4EE;--info-soft:#18324D;--muted-soft:#1B2B3B;--map-land:#163843;--map-line:#0B1724;--map-city:#235460;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1724;--surface:#122233;--surface-2:#15303A;--line:#24394C;--ink:#EAF1F5;--ink-2:#AFC0CD;--ink-3:#7F93A3;--brand:#0A1F33;--brand-ink:#FFF3E8;--teal:#3FC7B8;--teal-soft:#123F42;--accent:#FF8752;--accent-soft:#4A2618;--good:#4CC992;--good-soft:#123B2C;--warn:#E8B04E;--warn-soft:#3F3015;--bad:#FF7A6E;--bad-soft:#4A1F1C;--info:#7DB4EE;--info-soft:#18324D;--muted-soft:#1B2B3B;--map-land:#163843;--map-line:#0B1724;--map-city:#235460;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* шапка */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top{z-index:5}
.top .wrap{flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.logo{display:flex;align-items:center;font-family:var(--f-display)}
.logo i{display:block}
.logo small{font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.top select,.top input[type=date]{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--brand-ink);border-radius:10px;padding:7px 10px;min-height:36px}
.top select option{color:#0E2A47}
.daynav{display:flex;align-items:center;gap:4px}
.daynav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--brand-ink);border-radius:10px;width:36px;height:36px;cursor:pointer}
.daynav button:hover{background:rgba(255,255,255,.2)}
.tabs{border-top:1px solid rgba(255,255,255,.1)}
.tabs .wrap{overflow-x:auto;padding-block:6px;scrollbar-width:none}
.tab{background:none;border:0;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{opacity:1}
.tab .n{border-radius:999px}
main{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.banner{padding:12px 16px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.banner.ex{background:var(--accent-soft)}
.banner b{font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.head p{color:var(--ink-2)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
/* плитки */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-size:32px;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.good .v{color:var(--good)}
.kpi.warn .v{color:var(--warn)}
.kpi.bad .v{color:var(--bad)}
.kpi.acc .v{color:var(--accent)}
.panel{background:var(--surface);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel-h span{font-size:13px;color:var(--ink-3)}
/* чипы статусов */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ontime{background:var(--good-soft);color:var(--good)}
.st-late{background:var(--warn-soft);color:var(--warn)}
.st-missed,.st-nophoto{background:var(--bad-soft);color:var(--bad)}
.st-waiting{background:var(--info-soft);color:var(--info)}
.st-upcoming{background:var(--muted-soft);color:var(--ink-2)}
.st-pending{background:var(--info-soft);color:var(--info)}
.st-accepted{background:var(--good-soft);color:var(--good)}
.st-rejected{background:var(--bad-soft);color:var(--bad)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px}
/* схема */
.schema{width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2)}
.schema text{font-family:var(--f-body);fill:var(--ink-2)}
/* Leaflet: базовые правила (стили библиотеки встроены, внешние CSS недоступны) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--f-body);font-size:12px;outline-offset:1px}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}
.leaflet-right{right:0}
.leaflet-bottom{bottom:0}
.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}
.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-pan-anim .leaflet-tile,.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.3);border-radius:10px;overflow:hidden}
.leaflet-bar a{background:#fff;color:#2b2b2b;display:block;width:36px;height:36px;line-height:36px;text-align:center;text-decoration:none;font:600 20px/36px Arial,sans-serif;border-bottom:1px solid #ddd}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-bar a:hover{background:#f4f4f4}
.leaflet-bar a.leaflet-disabled{color:#bbb;cursor:default}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;padding:0 6px;font-size:11px;color:#333}
.leaflet-control-attribution a{color:#0078A8}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px;background:#fff;color:#1d2733;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:12px 16px;line-height:1.4;min-height:1px;font-size:13px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:26px;height:26px;font:18px/26px Tahoma,Verdana,sans-serif;color:#757575;text-decoration:none;background:transparent}
.leaflet-tooltip{position:absolute;padding:4px 8px;background:#fff;border-radius:6px;color:#1d2733;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;font-weight:600}
.leaflet-tooltip-right{margin-left:6px}
.leaflet-tooltip-left{margin-left:-6px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
/* наша карта */
.lmap{height:min(72vh,640px);min-height:380px;border-radius:12px;background:#FFFFFF;position:relative;z-index:0;border:1px solid var(--line)}
.ml{white-space:nowrap;pointer-events:none}
.ml span{display:block;transform:translate(-50%,-50%);text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff}
.ml-place span{font:500 11.5px/1 var(--f-body);color:#5E6772}
.ml-place.r0 span{font-size:12.5px;font-weight:600;color:#3F4852}
.lmap .ml-place.r1,.lmap .ml-place.r2,.lmap .ml-place.r3{display:none}
.lmap[data-z="9"] .ml-place.r1,.lmap[data-z="10"] .ml-place.r1,.lmap[data-z="11"] .ml-place.r1,.lmap[data-z="12"] .ml-place.r1,.lmap[data-z="13"] .ml-place.r1,.lmap[data-z="14"] .ml-place.r1,.lmap[data-z="15"] .ml-place.r1,.lmap[data-z="16"] .ml-place.r1{display:block}
.lmap[data-z="10"] .ml-place.r2,.lmap[data-z="11"] .ml-place.r2,.lmap[data-z="12"] .ml-place.r2,.lmap[data-z="13"] .ml-place.r2,.lmap[data-z="14"] .ml-place.r2,.lmap[data-z="15"] .ml-place.r2,.lmap[data-z="16"] .ml-place.r2{display:block}
.lmap[data-z="11"] .ml-place.r3,.lmap[data-z="12"] .ml-place.r3,.lmap[data-z="13"] .ml-place.r3,.lmap[data-z="14"] .ml-place.r3,.lmap[data-z="15"] .ml-place.r3,.lmap[data-z="16"] .ml-place.r3{display:block}
.mb span{display:inline-flex;align-items:center;gap:6px;transform:translate(-50%,-50%);white-space:nowrap;background:#fff;border-radius:999px;box-shadow:0 1px 3px rgba(14,42,71,.22);padding:4px 10px;font:600 12px/1.2 var(--f-body);color:#3A4552;cursor:pointer}
.mb span:hover{box-shadow:0 2px 8px rgba(14,42,71,.3)}
.mb i{font-style:normal;background:#0E2A47;color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px}
.mb.okb span{font-size:13px;padding:5px 12px}
.mb.dlb span{font-weight:500;font-size:11.5px;padding:3px 9px;background:rgba(255,255,255,.92)}
.mb.dlb.on span{font-weight:600}
.mb.dlb.zero span{background:none;box-shadow:none;color:#7A8591;padding:2px 4px;text-shadow:0 0 2px #fff,0 0 3px #fff}
.mb.mob span{font-size:11px;font-weight:500;padding:3px 8px;background:rgba(255,255,255,.95)}
.mb.mob.on span{font-weight:600}
.lmap[data-reg="mo"] .mob.small:not(.on){display:none}
.lmap[data-reg="spb"] .mob.small:not(.on){display:none}
.lmap[data-reg="spb"][data-z="11"] .mob.small,.lmap[data-reg="spb"][data-z="12"] .mob.small,.lmap[data-reg="spb"][data-z="13"] .mob.small,.lmap[data-reg="spb"][data-z="14"] .mob.small,.lmap[data-reg="spb"][data-z="15"] .mob.small,.lmap[data-reg="spb"][data-z="16"] .mob.small{display:block}
.lmap[data-reg="mo"][data-z="9"] .mob.small,.lmap[data-reg="mo"][data-z="10"] .mob.small,.lmap[data-reg="mo"][data-z="11"] .mob.small,.lmap[data-reg="mo"][data-z="12"] .mob.small,.lmap[data-reg="mo"][data-z="13"] .mob.small{display:block}
.lmap[data-reg="mo"] .ml-place{display:none!important}
.lmap.detail{background:#F2EFE9}
.lmap.detail .ml-place{display:none!important}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-tile-pane img{max-width:none!important;max-height:none!important}
.pp{display:flex;flex-direction:column;gap:6px;min-width:200px}
.pp b{font-size:14px}
.mptw{background:none;border:0}
.mpt{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--ring,#8A96A3);box-shadow:0 0 0 2px #fff,0 3px 8px rgba(14,42,71,.3);display:grid;place-items:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.mpt::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.mpt b{position:relative;font:700 11.5px/1 var(--f-body);color:#0E2A47}
.mpt:hover{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 0 2px #fff,0 5px 14px rgba(14,42,71,.35)}
.mpt.idle{width:14px;height:14px}
.mpt.idle::before{display:none}
.mpt.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #2F6FB0;opacity:0;animation:mptp 2.2s ease-out infinite}
@keyframes mptp{0%{transform:scale(.75);opacity:.55}100%{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion:reduce){.mpt.live::after{animation:none}}
.mptt{font-weight:600}
.ppw .leaflet-popup-content{margin:0;width:auto!important;min-width:300px}
.ppw .leaflet-popup-content-wrapper{border-radius:14px;padding:0;overflow:hidden;box-shadow:0 8px 28px rgba(14,42,71,.22)}
.ppc{font-size:13px;line-height:1.35;color:#13202B}
.ppc-h{padding:12px 16px 10px;border-bottom:1px solid #E8EDF0}
.ppc-h b{display:block;font-size:15px}
.ppc-h span{display:block;margin-top:2px;color:#5B6B7A;font-size:12px}
.ppc-sum{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 2px}
.ppc-l{padding:4px 8px 6px}
.ppc-r{display:grid;grid-template-columns:4px 44px minmax(0,1fr);gap:10px;align-items:center;padding:7px 8px;border-radius:10px}
.ppc-r:hover{background:#F3F6F8}
.ppc-r i{width:4px;height:30px;border-radius:2px;background:var(--c)}
.ppc-r time{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.ppc-r b{display:block;font-weight:600;overflow-wrap:anywhere}
.ppc-r small{display:block;color:#6B7A88;font-size:12px;margin-top:1px}
.ppc-r em{font-style:normal;font-weight:600;color:var(--c)}
.ppc-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff)}
.ppc-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.ppc-empty{padding:12px 16px;color:#6B7A88}
.ppc-f{display:flex;gap:16px;padding:9px 16px 12px;border-top:1px solid #E8EDF0;font-size:12.5px}
.ppc-f a{color:#0F6EA8;font-weight:600;text-decoration:none}
.ppc-f a:hover{text-decoration:underline}
.schema .okr{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink-3);letter-spacing:.04em;pointer-events:none}
.regsw{display:flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow);gap:4px;flex-wrap:wrap}
.regsw button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.regsw button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
/* списки смен */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:72px minmax(0,1.3fr) minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .time{font-family:var(--f-display);font-weight:600;font-size:16px}
.row .time small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-3)}
.row .who{min-width:0}
.row .who b{font-weight:600;display:block;overflow-wrap:anywhere}
.row .who span,.row .meta{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.row .end{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.row{grid-template-columns:60px minmax(0,1fr)}
.row .meta,.row .end{grid-column:2}
.row .end{justify-content:flex-start}}
.row.c{grid-template-columns:60px minmax(0,1fr) auto}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.empty{padding:20px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:12px}
/* кнопки и формы */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.acc{font-weight:600}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}

<script>
/* Liquid Glass: «капля» под активным пунктом меню и блик, который следует за курсором/пальцем */
document.addEventListener("DOMContentLoaded",()=>{
  const tabs=document.querySelector(".tabs"), wrap=document.getElementById("tabs");
  if(tabs&&wrap){const blob=document.createElement("i");blob.className="lg-blob";blob.setAttribute("aria-hidden","true");tabs.prepend(blob);tabs.classList.add("lg-on");
    const place=()=>{const a=wrap.querySelector('.tab[aria-selected="true"]');if(!a){blob.style.opacity=0;return}
      const r=a.getBoundingClientRect(),p=tabs.getBoundingClientRect();
      blob.style.width=r.width+"px";blob.style.height=r.height+"px";blob.style.transform=`translate(${r.left-p.left-tabs.clientLeft}px,${r.top-p.top-tabs.clientTop}px)`;blob.style.opacity=1};
    new MutationObserver(()=>requestAnimationFrame(place)).observe(wrap,{childList:true,subtree:true,attributes:true,attributeFilter:["aria-selected"]});
    wrap.addEventListener("scroll",()=>{blob.style.transition="none";place();requestAnimationFrame(()=>blob.style.transition="")},{passive:true});
    addEventListener("resize",place);setTimeout(place,300)}
  /* телефон / Telegram: кнопка меню с инициалами, активная вкладка прокручивается в центр панели */
  const top=document.querySelector(".top");
  if(top){const more=document.createElement("button");more.type="button";more.className="lg-more";more.setAttribute("aria-label","Меню");more.textContent="•••";top.appendChild(more);
    const ini=()=>{const n=(window.PS_ME&&window.PS_ME.name||"").trim().split(/\s+/).filter(Boolean);if(n.length)more.textContent=n.slice(0,2).map(x=>x[0]).join("").toUpperCase()};
    more.onclick=e=>{e.stopPropagation();ini();top.classList.toggle("menu-open")};
    document.addEventListener("click",e=>{if(top.classList.contains("menu-open")&&!e.target.closest(".sidefoot"))top.classList.remove("menu-open");else if(e.target.closest(".sidefoot button"))setTimeout(()=>top.classList.remove("menu-open"),150)});
    setTimeout(ini,1500)}
  if(wrap){let last=null;new MutationObserver(()=>{const a=wrap.querySelector('.tab[aria-selected="true"]');if(!a||a.dataset.tab===last)return;last=a.dataset.tab;
    if(wrap.scrollWidth>wrap.clientWidth)wrap.scrollTo({left:a.offsetLeft-(wrap.clientWidth-a.offsetWidth)/2,behavior:"smooth"})}).observe(wrap,{childList:true,subtree:true,attributes:true,attributeFilter:["aria-selected"]})}
  /* такая же «капля» в переключателе регионов (Москва / МО / СПб) */
  const ctl=document.querySelector(".ctl"), bx=document.getElementById("barX");
  if(ctl&&bx){const drop=document.createElement("i");drop.className="lg-drop";drop.setAttribute("aria-hidden","true");ctl.prepend(drop);ctl.classList.add("lg-on");
    const put=(instant)=>{const a=bx.querySelector('.regsw button[aria-selected="true"]');if(!a){drop.style.opacity=0;return}
      const r=a.getBoundingClientRect(),p=ctl.getBoundingClientRect();if(!r.width){drop.style.opacity=0;return}
      if(instant)drop.style.transition="none";
      drop.style.width=r.width+"px";drop.style.height=r.height+"px";drop.style.transform=`translate(${r.left-p.left-ctl.clientLeft}px,${r.top-p.top-ctl.clientTop}px)`;drop.style.opacity=1;
      if(instant)requestAnimationFrame(()=>drop.style.transition="")};
    new MutationObserver(()=>requestAnimationFrame(()=>put(false))).observe(bx,{childList:true,subtree:true,attributes:true,attributeFilter:["aria-selected"]});
    bx.addEventListener("scroll",()=>put(true),{passive:true,capture:true});
    addEventListener("resize",()=>put(true));setTimeout(()=>put(true),300)}
  const SEL=".btn,.fchips button,.suchip,.paybtn,.cp-btn,.mapback,#ps-modal button,.slot,.mcard";let cur=null;
  const move=e=>{const el=e.target.closest&&e.target.closest(SEL);if(cur&&cur!==el){cur.classList.remove("lg-hl");cur=null}
    if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty("--mx",(e.clientX-r.left)+"px");el.style.setProperty("--my",(e.clientY-r.top)+"px");
    if(cur!==el){el.classList.add("lg-hl");cur=el}};
  addEventListener("pointermove",move,{passive:true});addEventListener("pointerdown",move,{passive:true});
  addEventListener("pointerleave",()=>{if(cur){cur.classList.remove("lg-hl");cur=null}});
});
</script>

<script>
(function(){
"use strict";
const COLS=["projects","points","promoters","shifts","photos"];
const S={projects:[],points:[],promoters:[],shifts:[],photos:[],requests:[],messages:[]};
const loaded={};
let db=null, assets=null, dbState="loading";
const SLOTS={morning:{l:"Утро",t:"09:00"},day1:{l:"День",t:"13:00"},evening:{l:"Вечер",t:"17:00"}};
const TYPES=["Раздача листовок","Дегустация","Промо-стойка","Хелпер на мероприятии","Креативная акция"];
const STL={ontime:"Вовремя",late:"С опозданием",missed:"Срыв",nophoto:"Фото не пришло",waiting:"Идёт, ждём фото",upcoming:"Впереди"};
const SHIFT_MS=4*3600e3, GRACE_MS=20*60e3;
const TABS=[["day","План дня"],["shifts","Назначение смен"],["promoters","Сотрудники"],["points","Установка точек"],["projects","Проекты"],["photos","Фотоотчёты"],["money","Финансы"],["summary","Статистика"],["reg","Регистрация"],["access","Доступ"]];

/* Границы: OpenStreetMap (Nominatim), упрощены. Москва — 12 административных округов; область — внешний контур с вырезом Москвы. */
const OKR={CAO:"ЦАО",SAO:"САО",SVAO:"СВАО",VAO:"ВАО",UVAO:"ЮВАО",UAO:"ЮАО",UZAO:"ЮЗАО",ZAO:"ЗАО",SZAO:"СЗАО",ZelAO:"ЗелАО",NAO:"НАО",TAO:"ТАО"};
const polys=g=>g.t==="Polygon"?[g.c]:g.c;
function inRing(x,y,r){let ins=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[xi,yi]=r[i],[xj,yj]=r[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}return ins}
function inPoly(x,y,g){return polys(g).some(pl=>inRing(x,y,pl[0])&&!pl.slice(1).some(h=>inRing(x,y,h)))}
function geoRegion(lat,lng){if(!isFinite(lat)||!isFinite(lng)||!lat||!lng)return null;for(const k in GEO.okrugs)if(inPoly(lng,lat,GEO.okrugs[k]))return"msk";if(inPoly(lng,lat,GEO.mo))return"mo";return inSpb(lat,lng)?"spb":"other"}
function inSpb(lat,lng){if(typeof SPB==="undefined")return false;const b=SPB.b;if(lat<b[0][0]||lat>b[1][0]||lng<b[0][1]||lng>b[1][1])return false;return SPB.d.some(d=>d.p.some(pl=>{const r=pl.map(e=>decPoly(e).map(([a,c])=>[c,a]));return inRing(lng,lat,r[0])&&!r.slice(1).some(h=>inRing(lng,lat,h))}))}
function geoOkrug(lat,lng){for(const k in GEO.okrugs)if(inPoly(lng,lat,GEO.okrugs[k]))return OKR[k];return""}
const REG={msk:"Москва",mo:"Московская область",spb:"Санкт-Петербург",other:"За пределами области"};
const blobUrl=id=>(typeof window.blobUrl==="function"?window.blobUrl(id):"/_blob/"+id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,k)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+k);return iso(d)};
const fmtDate=s=>{const d=new Date(s+"T12:00:00");return d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})};
const fmtShort=s=>{const d=new Date(s+"T12:00:00");return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})};
const fmtTime=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())};
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const pct=(a,b)=>b?Math.round(a/b*100):null;
const plural=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return n+" "+(a>10&&a<20?f[2]:b===1?f[0]:b>=2&&b<=4?f[1]:f[2])};
const SM=["смена","смены","смен"];

let ui={region:"msk",mapZoom:"core",tab:"day",date:today(),project:"all",photoFilter:"pending",period:"7",armed:null};
try{const r=localStorage.getItem("ps-reg");if(r==="msk"||r==="mo"||r==="spb")ui.region=r;}catch(e){}
try{const t=localStorage.getItem("ps-tab");if(t&&TABS.some(x=>x[0]===t))ui.tab=t;}catch(e){}
if(location.hash&&TABS.some(x=>"#"+x[0]===location.hash))ui.tab=location.hash.slice(1);

/* индексы: пересобираются один раз после каждого изменения данных, а не на каждый поиск */
let IDXV=0,IDX=null;
function idx(){
  if(IDX&&IDX.v===IDXV)return IDX;
  const m={};for(const c of COLS){const mm=new Map();for(const x of S[c]||[])mm.set(x.id,x);m[c]=mm}
  const ph=new Map(),rej=new Map(),bp=new Map(),pn=new Map();
  for(const p of S.photos||[]){if(p.status==="rejected"){rej.set(p.shiftId,(rej.get(p.shiftId)||0)+1);continue}let a=ph.get(p.shiftId);if(!a)ph.set(p.shiftId,a=[]);a.push(p)}
  for(const a of ph.values())a.sort((x,y)=>x.takenAt-y.takenAt);
  for(const s of S.shifts||[]){let a=bp.get(s.promoterId);if(!a)bp.set(s.promoterId,a=[]);a.push(s);if(s.promoterName&&!pn.has(s.promoterId))pn.set(s.promoterId,s.promoterName)}
  return IDX={v:IDXV,m,ph,rej,bp,pn};
}
const NOPH=Object.freeze([]);
const byId=(col,id)=>{const m=idx().m[col];return m?m.get(id):S[col].find(x=>x.id===id)};
const ptName=id=>{const p=byId("points",id);return p?p.name:"Точка удалена"};
const prName=id=>{const p=byId("promoters",id);return p?p.name:(idx().pn.get(id)||"Сотрудник удалён")};
const pjName=id=>{const p=byId("projects",id);return p?p.name:"—"};
const inProject=x=>ui.project==="all"||x.projectId===ui.project;

function shiftStart(s){return new Date(s.date+"T"+(s.start||"09:00")+":00").getTime()}
function shiftPhotos(s){return idx().ph.get(s.id)||NOPH}
function shiftState(s,now=Date.now()){
  if(s.missed)return"missed";
  const st=shiftStart(s), ph=shiftPhotos(s);
  if(ph.length)return ph[0].takenAt<=st+GRACE_MS?"ontime":"late";
  if(now<st)return"upcoming";
  if(now<st+GRACE_MS)return"waiting";
  return"nophoto";
}
const PJ_CATS=[
  ["Внутренняя коммуникация",["Корпоратив","Форум","Тимбилдинг","Стратегическая сессия"]],
  ["Сервис для мероприятий",["Техническое оснащение","Администраторы","Координация","Хелперы","Хостес","Оформление","Логистика"]],
  ["Деловые мероприятия",["Конференция","Презентация","Форум","Встреча партнёров","Стратегическая сессия"]],
  ["Мероприятия с нуля",["Концепция","Сценарий","Оформление","Техническая режиссура","Координация"]],
  ["Event-маркетинг с работающими метриками",["Продажи","Посещаемость","Вовлечённость","Командное взаимодействие"]],
  ["Промо-акции и BTL под ключ",["Промо-активация","Бренд-коммуникация","Вовлекающий сценарий"]]];
const RATE_DEF=550, SHIFT_H=SHIFT_MS/3600e3;
const rateOf=p=>num(p&&p.rate)>0?num(p.rate):RATE_DEF;
const shiftRate=s=>num(s.rate)>0?num(s.rate):rateOf(byId("projects",s.projectId));
const fmtRub=v=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(v)).replace(/\s/g,"\u00a0")+"\u00a0₽";
const worked=st=>st==="ontime"||st==="late";

function stats(shifts){
  const r={total:shifts.length,ontime:0,late:0,missed:0,nophoto:0,waiting:0,upcoming:0};
  for(const s of shifts){const st=shiftState(s);r[st]++;}
  r.worked=r.ontime+r.late; r.due=r.ontime+r.late+r.missed+r.nophoto; r.started=r.due+r.waiting;
  return r;
}

function periodRange(){
  if(ui.period==="all")return [null,null];
  const n=Number(ui.period); return [addDays(ui.date,-(n-1)),ui.date];
}
function inPeriod(s){const [a,b]=periodRange();return(!a||s.date>=a)&&(!b||s.date<=b)}
function upSummary(){
  document.querySelectorAll("#smSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.per===ui.period));
  const [a,b]=periodRange();
  document.getElementById("smEb").textContent=(ui.project==="all"?"Все проекты":pjName(ui.project))+" · "+(a?(a===b?fmtDate(a):fmtShort(a)+" — "+fmtShort(b)):"за всё время");
  const sh=S.shifts.filter(s=>inProject(s)&&inPeriod(s)), r=stats(sh), ot=pct(r.ontime,r.due);
  const shIds=new Set(sh.map(s=>s.id)), ph=S.photos.filter(p=>shIds.has(p.shiftId)); const acc=ph.filter(p=>p.status==="accepted").length;
  document.getElementById("smKpi").innerHTML=kpiHtml([
    {v:`${pct(r.worked,r.due)??"—"}${r.due?"%":""}`,l:"Смен отработано",s:`${r.worked} из ${r.due} наступивших`,c:"good"},
    {v:ot==null?"—":ot+"%",l:"Фото вовремя",s:`${r.ontime} из ${r.due}`,c:ot==null?"":ot>=85?"good":ot>=60?"warn":"bad"},
    {v:r.missed+r.nophoto,l:"Срывы и нет фото",c:r.missed+r.nophoto?"bad":"good"},
    {v:ph.length,l:"Фото в архиве",s:`принято ${acc}`}]);
  // график
  const days=[]; const end=b||ui.date; const n=a?Math.min(31,Math.round((new Date(end)-new Date(a))/864e5)+1):14;
  for(let i=n-1;i>=0;i--)days.push(addDays(end,-i));
  const per=days.map(d=>{const x=stats(S.shifts.filter(s=>s.date===d&&inProject(s)));return{d,on:x.ontime,late:x.late,bad:x.missed+x.nophoto,rest:x.waiting+x.upcoming}});
  const max=Math.max(4,...per.map(p=>p.on+p.late+p.bad+p.rest));
  const W=760,H=220,L=32,B=26,T=10; const bw=(W-L-10)/days.length; const y=v=>H-B-(v/max)*(H-B-T);
  const step=max<=8?2:max<=20?5:10; let grid=""; for(let v=0;v<=max;v+=step)grid+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=per.map((p,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;let acc0=0,seg="";
    for(const [v,c] of [[p.on,"var(--good)"],[p.late,"var(--warn)"],[p.bad,"var(--bad)"],[p.rest,"var(--line)"]]){if(!v)continue;const y0=y(acc0+v),h=y(acc0)-y0;seg+=`<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h-1).toFixed(1)}" rx="2" fill="${c}"/>`;acc0+=v;}
    const lab=(days.length<=14||i%2===0)?`<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${new Date(p.d+"T12:00").getDate()}</text>`:"";
    return `<g><title>${fmtShort(p.d)}: вовремя ${p.on}, с опозданием ${p.late}, срыв/нет фото ${p.bad}, впереди ${p.rest}</title>${seg}${lab}</g>`}).join("");
  document.getElementById("chart").innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Смены по дням">${grid}${bars}</svg>`;
  document.getElementById("chN").textContent=`${fmtShort(days[0])} — ${fmtShort(days[days.length-1])}`;
  document.getElementById("chLeg").innerHTML=`<span class="chip st-ontime">Вовремя</span><span class="chip st-late">С опозданием</span><span class="chip st-missed">Срыв / нет фото</span><span class="chip st-upcoming">Впереди</span>`;
  // таблица по проектам
  const pjs=S.projects.filter(p=>ui.project==="all"||p.id===ui.project);
  const rows=pjs.map(p=>{const x=stats(sh.filter(s=>s.projectId===p.id));return{p,x}}).filter(o=>o.x.total);
  document.getElementById("smTbl").innerHTML=rows.length?`<table><thead><tr><th>Проект</th><th class="num">Смен</th><th class="num">Отработано</th><th class="num">Фото вовремя</th><th class="num">Срывы</th></tr></thead><tbody>${rows.map(({p,x})=>`<tr><td><b>${esc(p.name)}</b>${p.client?`<div class="hint">${esc(p.client)}</div>`:""}</td><td class="num">${x.total}</td><td class="num">${x.worked}</td><td class="num">${pct(x.ontime,x.due)??"—"}${x.due?"%":""}</td><td class="num">${x.missed+x.nophoto}</td></tr>`).join("")}</tbody></table>`:emptyBox("За этот период смен нет.");
  // сигналы
  const sig=[];
  if(r.missed+r.nophoto)sig.push(["st-missed",`${plural(r.missed+r.nophoto,SM)} без подтверждённого выхода`,"Срыв или ни одного фото со смены."]);
  if(r.late)sig.push(["st-late",`${plural(r.late,SM)} с опозданием`,"Первое фото позже 20 минут после начала."]);
  const pend=ph.filter(p=>p.status==="pending").length; if(pend)sig.push(["st-pending",`${pend} фото ждут проверки`,"Откройте вкладку «Фотоотчёты»."]);
  const risky=S.promoters.filter(p=>p.active!==false&&promStats(p.id).risk); if(risky.length)sig.push(["st-missed",`${plural(risky.length,["сотрудник","сотрудника","сотрудников"])} под вопросом`,"Подробности во вкладке «Сотрудники»."]);
  document.getElementById("smSig").innerHTML=sig.length?sig.map(([c,t,d])=>`<div class="row" style="grid-template-columns:auto minmax(0,1fr)"><span class="chip ${c}">!</span><div class="who"><b>${t}</b><span>${d}</span></div></div>`).join(""):emptyBox("Сигналов нет: смены идут по плану.");
}
function reportText(){

  const ph=S.photos.filter(p=>sh.some(s=>s.id===p.shiftId)&&p.status!=="rejected").length;

async function guard(fn,okMsg){
  if(!db){toast("База недоступна в этом просмотре");return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){const c=e&&e.code;toast(c==="quota_exceeded"?"Место в базе закончилось: удалите старые записи":c==="invalid_argument"?"Нет прав на изменение или неверные данные":"Не получилось сохранить, попробуйте ещё раз");console.error(e);return false}
}

/* сжатие фото перед загрузкой */
function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"))};img.src=u})}
main.addEventListener("change",async e=>{
  const inp=e.target.closest("input[data-up]"); if(!inp||!inp.files||!inp.files[0])return;
  const shiftId=inp.dataset.up, file=inp.files[0], hr=inp.dataset.hour; inp.value="";
  if(!assets){toast("Загрузка фото доступна редакторам страницы");return}
  toast("Загружаю фото…");
  try{const blob=await compress(file).catch(()=>file);const up=await assets.upload(blob,{type:blob.type&&/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:"image/jpeg"});
    await guard(()=>db.collection("photos").add({shiftId,hour:hr==null||hr===""?null:hr==="extra"?"extra":Number(hr),assetId:up.id,takenAt:isStaff()?Date.now():file.lastModified&&Math.abs(Date.now()-file.lastModified)<864e5*3?file.lastModified:Date.now(),uploadedAt:Date.now(),status:"pending"}),"Фото загружено и ждёт проверки");}

});

/* почасовые отчёты: отметка в начале смены и фото за каждый час */
const CP_N=Math.round(SHIFT_H), CP_EARLY=10*60e3, CP_GRACE=15*60e3;
const cpTime=(s,k)=>shiftStart(s)+k*3600e3;
const cpLabel=k=>k===0?"Начало смены":`${k}-й час`;
const cpTitle=k=>k===0?"Отметиться на точке":`Отчёт за ${k}-й час`;
const cpGraceOf=k=>k===0?GRACE_MS:CP_GRACE;
const photoHour=p=>p.hour==null||p.hour===""?null:p.hour==="extra"?"extra":Number(p.hour);
const photoLate=(p,s)=>{const h=photoHour(p);if(h==="extra")return false;const k=h==null?0:h;return p.takenAt>cpTime(s,k)+cpGraceOf(k)};
function cpPhotos(s){const by={},legacy=[];for(const p of shiftPhotos(s)){const h=photoHour(p);if(h==null)legacy.push(p);else(by[h]=by[h]||[]).push(p)}if(!by[0]&&legacy.length)by[0]=[legacy[0]];return by}
function cpState(s,k,now){const by=cpPhotos(s),t=cpTime(s,k);
  if(by[k]&&by[k].length){const p=by[k][0];return{st:p.takenAt>t+cpGraceOf(k)?"late":"done",p}}
  if(now<t-CP_EARLY)return{st:"wait"};
  if(now<=t+cpGraceOf(k))return{st:"due"};
  if(now-shiftEnd(s)<2*864e5)return{st:"overdue"};
  return{st:"missed"}}
const upBtn=(s,k,txt,cls)=>`<label class="${cls}">${txt}<input type="file" accept="image/*" capture="environment" data-up="${esc(s.id)}" data-hour="${k}" hidden></label>`;
function cpGrid(s){const now=Date.now();return `<div class="cps">${[...Array(CP_N+1)].map((_,k)=>{const c=cpState(s,k,now),t=cpTime(s,k);
  const body=c.st==="done"?`<span class="cp-ok">✓ ${fmtTime(c.p.takenAt)}</span>`:c.st==="late"?`<span class="cp-lt">✓ ${fmtTime(c.p.takenAt)}, позже</span>`:c.st==="wait"?`<span class="hint">откроется в ${fmtTime(t-CP_EARLY)}</span>`:c.st==="due"?upBtn(s,k,"📷 Сдать","cp-btn due"):c.st==="overdue"?upBtn(s,k,"📷 Сдать с опозданием","cp-btn"):`<span class="cp-miss">не сдан</span>`;
  return `<div class="cp cp-${c.st}"><b>${cpLabel(k)}</b><span class="hint">${fmtTime(t)}</span>${body}</div>`}).join("")}</div>`}
function myShiftCard(s,big){
  const pt=byId("points",s.pointId)||{}, st=shiftState(s), ml=mapLink(pt), extra=(cpPhotos(s).extra||[]).length;
  return `<article class="mcardS ${big?"big":""}"><div class="mh"><div><div class="eyebrow">${esc(fmtDate(s.date))} · ${esc(s.start||"")}–${fmtTime(shiftEnd(s))}</div>
    <h3>${esc(pt.name||"Точка удалена")}</h3>${pt.address||pt.district?`<p class="hint">${esc([pt.address,pt.district].filter(Boolean).join(" · "))}</p>`:""}</div>${chip(st)}</div>
    ${s.type?`<p class="hint">${esc(s.type)}</p>`:""}
    ${big?cpGrid(s):""}${extra?`<p class="hint">Дополнительных фото: ${extra}</p>`:""}
    ${ml?`<div class="acts"><a class="btn" href="${ml}" target="_blank" rel="noopener">Открыть на карте</a></div>`:""}</article>`;
}
function dueList(){const now=Date.now(),out=[];for(const s of myShifts()){if(s.missed||now<shiftStart(s)-30*60e3||now>shiftEnd(s)+CP_GRACE)continue;for(let k=0;k<=CP_N;k++)if(cpState(s,k,now).st==="due")out.push({s,k})}return out}

    <section class="panel"><h3>Ваш руководитель</h3><div id="pfTeam" class="hint">Загружаю…</div><p class="hint">Руководитель ставит смены, выдаёт материалы и отмечает выплаты. Вопросы про смены и точки решает он.</p></section>
    <section class="panel"><div class="panel-h"><h3>Мои выплаты</h3><span>${fmtRub(tot)}</span></div>${earnedL.length?`<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Точка</th><th class="num">Сумма</th><th>Статус</th></tr></thead><tbody>${earnedL.map(s=>`<tr><td>${esc(fmtShort(s.date))}</td><td>${esc(ptName(s.pointId))}</td><td class="num"><b>${fmtRub(SHIFT_H*shiftRate(s))}</b></td><td>${s.paid?'<span class="st-paid">✓ выплачено</span>':'<span class="st-due">ждёт выплаты</span>'}</td></tr>`).join("")}</tbody></table></div>`:emptyBox("Отработанных смен пока нет.")}</section>
    <section class="panel"><h3>По неделям</h3>${weeks?`<div class="tbl-wrap"><table><thead><tr><th>Неделя</th><th class="num">Отработано</th><th class="num">Заработано</th></tr></thead><tbody>${weeks}</tbody></table></div>`:emptyBox("Пока пусто.")}</section>`;
  const fill=rows=>{const t=document.getElementById("pfTeam");if(!t)return;t.innerHTML=rows&&rows.length?rows.map(x=>`<div class="tm"><b>${esc(x.name||"Без имени")}</b> · ${esc(window.psMembers.roleLabel(x.role))}${x.phone?` · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:""}${x.telegram?` · ${esc(x.telegram)}`:""}</div>`).join(""):"Контакты руководителей пока не заполнены — напишите во вкладке «Написать руководителю»."};
  if(ui.team)fill(ui.team);else if(window.psMembers&&window.psMembers.team)window.psMembers.team().then(rows=>{ui.team=rows||[];fill(ui.team)}).catch(()=>{const t=document.getElementById("pfTeam");if(t)t.textContent="Не удалось загрузить контакты."});
}
async function loadOcc(date){
  if(ui.occLoading===date)return; ui.occLoading=date;
  try{const rows=await window.psMembers.occupancy(date);const map={};for(const r of rows||[])map[r.point_id+"|"+r.slot]={s:r.shifts,r:r.requests};ui.occ={date,map}}
  catch(e){console.error(e);ui.occ={date,map:{},err:true}}
  ui.occLoading=null; if(ui.tab==="signup")updateTab();
}
function upSignup(){
  const el=document.getElementById("suBox"); if(!el)return;
  const c=myCard(); if(!c){el.innerHTML=noCard();return}
  const days=[...Array(7)].map((_,i)=>addDays(today(),i));
  if(!days.includes(ui.suDate))ui.suDate=days[0]; ui.suFilter=ui.suFilter||"free";
  const date=ui.suDate, occ=ui.occ&&ui.occ.date===date?ui.occ.map:null; if(!occ)loadOcc(date);
  const now=Date.now(), me=window.PS_ME||{}, mineD=myShifts().filter(s=>s.date===date), myReq=(S.requests||[]).filter(r=>r.userId===me.id&&r.date===date&&r.status==="new");
  const pts=S.points.filter(p=>p.active!==false&&(!p.projectId||(byId("projects",p.projectId)||{}).active!==false)).sort((a,b)=>(a.district||"").localeCompare(b.district||"","ru")||a.name.localeCompare(b.name,"ru"));
  const state=(p,k)=>{const st=new Date(date+"T"+SLOTS[k].t+":00").getTime(),o=occ&&occ[p.id+"|"+k];
    if(mineD.some(s=>s.pointId===p.id&&s.slot===k))return["mine","ваша смена"];
    if(myReq.some(r=>r.pointId===p.id&&r.slot===k))return["req","заявка подана"];
    if(st<=now)return["closed","запись закрыта"];
    if(!occ)return["closed","…"];
    if(o&&o.s>0)return["busy","занято"];
    if(mineD.some(s=>s.slot===k)||myReq.some(r=>r.slot===k))return["clash","вы заняты"];
    return["free",o&&o.r?`свободно · хотят ещё ${o.r}`:"свободно"]};
  const all=pts.map(p=>({p,sl:Object.keys(SLOTS).map(k=>[k,...state(p,k)])})), free=all.filter(x=>x.sl.some(s=>s[1]==="free")), list=ui.suFilter==="all"?all:free;
  el.innerHTML=`<div class="suhead"><div class="chips">${days.map((d,i)=>`<button type="button" class="suchip ${d===date?"on":""}" data-act="su-date" data-id="${d}">${i===0?"сегодня":i===1?"завтра":esc(fmtShort(d))}</button>`).join("")}</div>
    <div class="chips"><button type="button" class="suchip ${ui.suFilter==="free"?"on":""}" data-act="su-filter" data-id="free">Свободные ${occ?free.length:""}</button><button type="button" class="suchip ${ui.suFilter==="all"?"on":""}" data-act="su-filter" data-id="all">Все ${pts.length}</button></div></div>
    ${!occ?`<p class="hint">Загружаю, какие слоты свободны…</p>`:ui.occ.err?`<p class="err">Не удалось узнать занятость точек. Обновите страницу.</p>`:""}
    ${list.length?`<div class="sulist">${list.map(({p,sl})=>`<article class="sucard"><h3>${esc(p.name)}</h3>${p.district||p.address?`<p class="hint">${esc([p.district,p.address].filter(Boolean).join(" · "))}</p>`:""}
      <div class="slots">${sl.map(([k,st,lab])=>{const key="su:"+p.id+"|"+k,arm=ui.armed===key;return `<button type="button" class="slot su-${st} ${arm?"arm":""}" ${st==="free"?`data-act="su-req" data-id="${esc(p.id+"|"+k)}"`:"disabled"} aria-label="${esc(p.name)}, ${SLOTS[k].l}: ${esc(lab)}"><b>${SLOTS[k].l}</b><span>${arm?"нажмите ещё раз":esc(lab)}</span></button>`}).join("")}</div></article>`).join("")}</div>`
      :emptyBox(occ?"На этот день свободных слотов нет. Посмотрите другой день или нажмите «Все».":"Загружаю…")}
    <p class="hint" style="margin-top:12px">Нажмите на свободный слот два раза — заявка уйдёт руководителю. Ответ появится во вкладке «Моя смена». «Хотят ещё» — на слот уже есть чужие заявки: подать можно, руководитель выберет одного.</p>`;
}
function upReport(){
  const el=document.getElementById("rpBox"); if(!el)return;
  const c=myCard(); if(!c){el.innerHTML=noCard();return}
  const now=Date.now(), l=myShifts().filter(s=>!s.missed&&shiftStart(s)-30*60e3<=now&&now-shiftEnd(s)<7*864e5).sort((a,b)=>shiftStart(b)-shiftStart(a));
  if(!l.length){el.innerHTML=`<section class="panel"><h3>Отчётов пока нет</h3><p class="hint">Здесь появятся ваши смены за последнюю неделю: фото за каждый час. Отчёты открываются за 10 минут до начала смены.</p></section>`;return}
  el.innerHTML=l.map(s=>{const id=esc(s.id), by=cpPhotos(s), ok=[...Array(CP_N+1)].filter((_,k)=>by[k]&&by[k].length).length;
    return `<section class="panel"><div class="panel-h"><h3>${esc(ptName(s.pointId))}</h3><span>фото ${ok} из ${CP_N+1}</span></div><p class="hint">${esc(fmtDate(s.date))} · ${esc(s.start||"")}–${fmtTime(shiftEnd(s))}</p>
      ${cpGrid(s)}</section>`}).join("");
}
let notified=new Set();try{notified=new Set(JSON.parse(localStorage.getItem("ps-notified")||"[]"))}catch(_){}
setInterval(()=>{
  if(!isStaff()||!S.shifts)return;
  const d=dueList(); document.title=(d.length?"🔔 ":"")+"Промосеть";
  let fresh=false;
  for(const {s,k} of d){const key=s.id+":"+k;if(notified.has(key))continue;notified.add(key);fresh=true;
    const msg=cpTitle(k)+" — "+((byId("points",s.pointId)||{}).name||"точка");
    toast("🔔 Пора: "+msg);
    try{if("Notification" in window&&Notification.permission==="granted")new Notification("Промосеть: пора сдать отчёт",{body:msg,tag:key})}catch(_){}
    try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(_){}}
  if(fresh){try{localStorage.setItem("ps-notified",JSON.stringify([...notified].slice(-300)))}catch(_){}}
  if(ui.tab==="me"||ui.tab==="report"){const a=document.activeElement;if(!(a&&a.closest&&a.closest("form[data-rep]")))updateTab()}
},30000);
function upWrite(){
  const el=document.getElementById("wrList"); if(!el)return;
  const me=window.PS_ME||{}, l=(S.messages||[]).filter(m=>m.userId===me.id).sort((a,b)=>b.createdAt-a.createdAt);
  el.innerHTML=l.length?l.map(m=>`<div class="msg"><div class="hint">${esc(fmtShort(ymdOf(m.createdAt)))}, ${fmtTime(m.createdAt)} · ${m.reply?"есть ответ":"ждёт ответа"}</div><div class="q">${esc(m.text)}</div>${m.reply?`<div class="a"><b>${esc(m.repliedBy||"Руководитель")}:</b> ${esc(m.reply)}</div>`:""}</div>`).join(""):`<p class="hint">Обращений пока нет.</p>`;
}
/* полное удаление человека: вход на сайт, карточка, будущие смены; история остаётся с именем */
async function deletePerson(cardId,uid){
  const p=cardId?byId("promoters",cardId):null, now=Date.now();
  if(uid&&uid!==(window.PS_ME||{}).id)await window.psMembers.removeAccount(uid);
  if(p){const fut=S.shifts.filter(s=>s.promoterId===p.id&&shiftStart(s)>now), past=S.shifts.filter(s=>s.promoterId===p.id&&shiftStart(s)<=now&&!s.promoterName);
    for(const s of fut){for(const ph of S.photos.filter(x=>x.shiftId===s.id))await db.doc("photos/"+ph.id).delete();await db.doc("shifts/"+s.id).delete()}
    for(const s of past)await db.doc("shifts/"+s.id).update({promoterName:p.name});
    for(const r of (S.requests||[]).filter(r=>r.promoterId===p.id&&r.status==="new"))await db.doc("requests/"+r.id).update({status:"rejected",decidedAt:now});
    await db.doc("promoters/"+p.id).delete()}
  return p;
}
/* сторона руководителя: заявки и обращения */
function upRequests(){
  const el=document.getElementById("rqPanel"); if(!el)return;
  const rq=(S.requests||[]).filter(r=>r.status==="new").sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
  el.hidden=!rq.length; if(!rq.length){el.innerHTML="";return}
  el.innerHTML=`<div class="panel-h"><h3>Заявки сотрудников</h3><span>${rq.length}</span></div>${rq.map(r=>{const pt=byId("points",r.pointId)||{},taken=S.shifts.some(s=>s.pointId===r.pointId&&s.date===r.date&&s.slot===r.slot);
    return `<div class="reqrow"><div><b>${esc(r.name||prName(r.promoterId))}</b><div class="hint">${esc(pt.name||"Точка удалена")} · ${esc(fmtShort(r.date))} · ${esc((SLOTS[r.slot]||{}).l||"")} ${esc(r.start||"")}${taken?' · <span class="bad">слот уже занят</span>':""}</div></div>
      <div class="ra"><button class="btn sm primary" data-act="req-ok" data-id="${esc(r.id)}"${taken?" disabled":""}>Одобрить</button><button class="btn sm" data-act="req-no" data-id="${esc(r.id)}">Отклонить</button></div></div>`}).join("")}`;
}
function upMsgs(){
  const el=document.getElementById("msgPanel"); if(!el)return;
  const l=(S.messages||[]).slice().sort((a,b)=>(a.reply?1:0)-(b.reply?1:0)||b.createdAt-a.createdAt).slice(0,15);
  el.hidden=!l.length; if(!l.length){el.innerHTML="";return}
  const n=l.filter(m=>!m.reply).length;
  el.innerHTML=`<div class="panel-h"><h3>Обращения сотрудников</h3><span>${n?"новых: "+n:""}</span></div>${l.map(m=>`<div class="msg"><div class="hint"><b>${esc(m.name||prName(m.promoterId))}</b> · ${esc(fmtShort(ymdOf(m.createdAt)))}, ${fmtTime(m.createdAt)}</div><div class="q">${esc(m.text)}</div>
    ${m.reply?`<div class="a"><b>${esc(m.repliedBy||"Ответ")}:</b> ${esc(m.reply)}</div>`:`<form class="rpl" data-reply="${esc(m.id)}"><textarea rows="2" aria-label="Ответ для ${esc(m.name||"сотрудника")}" placeholder="Ответ сотруднику" required></textarea><button class="btn sm primary" type="submit">Ответить</button></form>`}</div>`).join("")}`;
}
const cardSel=m=>`<select data-link="${esc(m.user_id)}" aria-label="Карточка сотрудника для ${esc(m.email)}"><option value="">не привязан</option>${S.promoters.filter(p=>p.active!==false||p.userId===m.user_id).sort((a,b)=>a.name.localeCompare(b.name,"ru")).map(p=>{const other=p.userId&&p.userId!==m.user_id;return `<option value="${esc(p.id)}"${p.userId===m.user_id?" selected":""}${other?" disabled":""}>${esc(p.name)}${other?" (занята)":""}</option>`}).join("")}</select>`;
main.addEventListener("submit",async e=>{
  const fm=e.target.closest&&e.target.closest("form[data-rep],form[data-reply]"); if(!fm)return; e.preventDefault();
  const btn=fm.querySelector("button[type=submit]"); if(btn)btn.disabled=true;
  const id=fm.dataset.reply, t=fm.querySelector("textarea").value.trim(); if(!t){if(btn)btn.disabled=false;return}
  const ok=await guard(()=>db.doc("messages/"+id).update({reply:t,status:"answered",repliedAt:Date.now(),repliedBy:(window.PS_ME&&window.PS_ME.name)||"Руководитель"}),"Ответ отправлен");
  if(ok){if(document.activeElement)document.activeElement.blur();updateTab()}else if(btn)btn.disabled=false;
});
main.addEventListener("change",async e=>{
  const s=e.target.closest&&e.target.closest("select[data-link]"); if(!s)return;
  const uid=s.dataset.link, pid=s.value;
  const ok=await guard(async()=>{for(const p of S.promoters.filter(p=>p.userId===uid&&p.id!==pid))await db.doc("promoters/"+p.id).update({userId:null});if(pid)await db.doc("promoters/"+pid).update({userId:uid})},pid?"Аккаунт привязан к карточке":"Привязка снята");
  updateTab();
});

/* ---------- старт ---------- */
renderAll(true);
setInterval(()=>{if(ui.tab==="day")updateTab()},60000);
(async()=>{
  try{db=window.claude&&await window.claude.use("db")}catch(e){db=null}
  if(!db){dbState="off";renderAll();document.documentElement.classList.remove("ps-wait");return}
  dbState="on";renderAll(true);setTimeout(()=>document.documentElement.classList.remove("ps-wait"),0);
  try{assets=await window.claude.use("assets")}catch(e){assets=null}
  for(const c of [...COLS,"requests","messages"]){
    db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));IDXV++;loaded[c]=true;renderAll()},
      err=>{console.error(c,err);if(err&&err.code==="revoked"){dbState="off";renderAll()}});
  }
})();
})();
